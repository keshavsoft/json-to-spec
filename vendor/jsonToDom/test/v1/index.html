<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Search & Table | JSON to DOM (v14)</title>
    <!-- Bootstrap 5 CSS -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <!-- Bootstrap Icons -->
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> -->
    <!-- json-to-dom CDN -->
    <!-- <script type="module" src="https://cdn.jsdelivr.net/gh/keshavsoft/json-to-dom/docs/dist/v3/min.js"></script> -->

    <script src="https://cdn.tailwindcss.com"></script>


    <style>
        .text-small {
            font-size: 0.85rem;
        }

        .nav-link {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .nav-link:hover {
            color: #0dcaf0 !important;
        }

        .nav-link.active {
            color: #0d6efd !important;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 36px;
            background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 1.25rem;
            text-decoration: none;
        }

        /* Mobile specific adjustments */
        @media (max-width: 991.98px) {
            .navbar-collapse {
                background: #212529;
                padding: 1rem 0.5rem;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                margin-top: 0.5rem;
                border-radius: 8px;
            }

            .navbar-nav {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
                gap: 0.5rem;
            }

            .navbar-nav .nav-item {
                min-width: 70px;
            }
        }

        /* Active/clicked filter row highlight */
        .filter-row-active {
            background-color: rgba(13, 110, 253, 0.08);
            border-radius: 6px;
            outline: 1.5px solid rgba(13, 110, 253, 0.35);
            transition: background-color 0.2s ease, outline 0.2s ease;
        }
    </style>
</head>

<body class="bg-light">
    <!-- Dynamic Header & Menu rendered by json-to-dom-menu -->
    <div id="header-container"></div>



    <div id="start" class="max-w-md mx-auto mt-10 bg-white rounded-xl shadow-md overflow-hidden border border-gray-200">
        <!-- Header -->
        <div class="px-6 py-4 bg-gray-50 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-gray-800">Account Information</h2>
            <p class="text-sm text-gray-500 mt-1">Please fill in your details to update your profile.</p>
        </div>

        <!-- Body -->
        <form class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="name">Full Name</label>
                <input type="text" id="name"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="John Doe">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email Address</label>
                <input type="email" id="email"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="you@example.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="role">Role</label>
                <select id="role"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option>Developer</option>
                    <option>Designer</option>
                    <option>Manager</option>
                </select>
            </div>
        </form>

        <!-- Footer -->
        <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-end space-x-3">
            <button type="button"
                class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Cancel
            </button>
            <button type="submit"
                class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-md shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Save Changes
            </button>
        </div>
    </div>


    <main class="w-full px-4 pb-5">

        <div class="mb-4 overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm">

            <div class="flex items-center justify-between border-b border-gray-200 bg-white px-4 py-3">
                <span class="font-semibold text-gray-600">
                    <span class="mr-1">⚱</span> Filters
                </span>

                <button id="card-clear-filters-btn" type="button"
                    class="rounded border border-gray-400 px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-100">
                    <span class="mr-1">⊗</span> Clear
                </button>
            </div>

            <div class="p-4">
                <div id="form-container"></div>
            </div>

        </div>

        <div class="overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <div id="table-container"></div>
            </div>
        </div>

        <div id="datalist-container"></div>

    </main>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./index.js"></script>
</body>

</html>
